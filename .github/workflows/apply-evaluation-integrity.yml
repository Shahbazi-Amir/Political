name: Apply evaluation integrity hardening

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-evaluation-integrity.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply tested patch payload
        shell: bash
        run: |
          cat > /tmp/political-patch.b64 <<'PAYLOAD'
[... clipped payload omitted in summary ...]
PAYLOAD
          base64 -d /tmp/political-patch.b64 > /tmp/political-patch.tar.gz
          tar -xzf /tmp/political-patch.tar.gz -C .
          rm .github/workflows/apply-evaluation-integrity.yml
      - name: Validate patch before commit
        run: |
          python -m compileall -q political_core
          python -m pytest -q -m "not live"
          python -m political_core.dataset evals/cases/persian_political_review_queue.jsonl.gz --require-review-queue-ready
          python -m political_core.dataset_manifest evals/cases/persian_political_review_queue.jsonl.gz
          python -m political_core.cli --eval-jsonl evals/fixtures/smoke.jsonl
          git diff --check
      - name: Commit and push tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden evaluation integrity and release evidence"
          git push origin HEAD:main
