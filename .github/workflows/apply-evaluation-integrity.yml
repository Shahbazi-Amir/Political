name: Apply evaluation integrity hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-evaluation-integrity.yml"

permissions:
  contents: write

concurrency:
  group: evaluation-integrity-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply staged patch payload
        shell: bash
        run: |
          cat .github/patches/evaluation-integrity.* > /tmp/political-patch.b64
          base64 -d /tmp/political-patch.b64 > /tmp/political-patch.tar.gz
          tar -xzf /tmp/political-patch.tar.gz -C .
      - name: Validate patch before commit
        shell: bash
        run: |
          python -m compileall -q political_core
          python -m pytest -q -m "not live"
          python -m political_core.dataset evals/cases/persian_political_review_queue.jsonl.gz --require-review-queue-ready
          python -m political_core.dataset_manifest evals/cases/persian_political_review_queue.jsonl.gz
          python -m political_core.cli --eval-jsonl evals/fixtures/smoke.jsonl
          git diff --check
      - name: Commit and push tested code
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/live-validation.yml .github/workflows/apply-evaluation-integrity.yml
          rm .github/patches/evaluation-integrity.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden evaluation integrity and release evidence"
          git push origin HEAD:main
