name: Live validation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/live-validation-trigger

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install live dependencies
        run: python -m pip install -e '.[dev,openai]'
      - name: Detect live configuration
        id: config
        env:
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        shell: bash
        run: |
          if [[ -n "$SEARXNG_URL" && -n "$OPENAI_API_KEY" && -n "$OPENAI_MODEL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live validation skipped: one or more required repository secrets are not configured."
          fi
      - name: Run live Quick and Deep validation
        if: steps.config.outputs.configured == 'true'
        env:
          RUN_LIVE_TESTS: "1"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python -m pytest -q -m live tests/test_live.py
      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.config.outputs.configured }}" == "true" ]]; then
            echo "Live validation executed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live validation SKIPPED: configure SEARXNG_URL, OPENAI_API_KEY and OPENAI_MODEL repository secrets, then dispatch again." >> "$GITHUB_STEP_SUMMARY"
          fi
