[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "political-core"
version = "0.7.0"
description = "Evidence-first political fact-checking core with calibrated confidence, provenance, and low-cost verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
redis = ["redis>=5"]
dev = ["pytest>=8"]

[project.scripts]
political-check = "political_core.cli:main"
political-dataset = "political_core.dataset:main"
political-review = "political_core.review:main"
political-review-governance = "political_core.review_governance:main"
political-dataset-manifest = "political_core.dataset_manifest:main"
political-dataset-sources = "political_core.source_check:main"
political-readiness = "political_core.readiness:main"
political-benchmark-report = "political_core.benchmark_report:main"
political-benchmark-run = "political_core.benchmark_runner:main"

[tool.setuptools.packages.find]
include = ["political_core*"]

[tool.pytest.ini_options]
markers = ["live: optional network/API integration tests"]
