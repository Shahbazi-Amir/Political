[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "political-core"
version = "0.1.0"
description = "Evidence-first political fact-checking core with strict source and cost controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
political-check = "political_core.cli:main"

[tool.setuptools.packages.find]
include = ["political_core*"]
