[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "political-core"
version = "0.3.0"
description = "Evidence-first political fact-checking core with calibrated confidence, provenance, and low-cost verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
political-check = "political_core.cli:main"

[tool.setuptools.packages.find]
include = ["political_core*"]

[tool.pytest.ini_options]
markers = ["live: optional network/API integration tests"]
